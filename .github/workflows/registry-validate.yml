name: Governance Native Version Integrity

# Run every PR targeting main, without path filters. This is not a merge lock
# until repository branch protection/rulesets require its unique check name.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-version-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned revision without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 exact official commit
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 exact official commit
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-registry.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-registry.lock
      - name: Run full tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Validate local immutable fixed file Manifest
        run: python -m registry.validate_registry --root . validate-local
      - name: Validate candidate schema, not authorization
        run: python -m registry.validate_registry --root . validate-candidate
      - name: Check full PR diff or main push diff for whitespace faults
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE" HEAD
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
              git diff --check "$PUSH_BEFORE" HEAD
            fi
          fi

  audit-published:
    name: audit-published
    needs: validate
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-registry.lock
      - run: python -m pip install -r requirements-registry.lock
      - name: Verify exact annotated Tag and GENESIS mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTAG'
          import json, os, subprocess
          ref=os.environ["GITHUB_REF"]
          repo=os.environ["GITHUB_REPOSITORY"]
          if not ref.startswith("refs/tags/v"): raise SystemExit("TAG_REF_REQUIRED")
          name=ref.removeprefix("refs/tags/")
          with open("registry/GENESIS.json") as handle: genesis=json.load(handle)
          if genesis["release_tag"] != name: raise SystemExit("TAG_GENESIS_MISMATCH")
          ref_obj=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/git/ref/tags/{name}"],text=True))
          if ref_obj["object"]["type"]!="tag": raise SystemExit("ANNOTATED_TAG_REQUIRED")
          tag=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/git/tags/{ref_obj['object']['sha']}"],text=True))
          checkout=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if tag["object"]["type"]!="commit" or tag["object"]["sha"]!=checkout: raise SystemExit("TAG_COMMIT_MISMATCH")
          print("TAG_SOURCE_MATCH",name,checkout)
          PYTAG
      - name: Audit released policy and current registry
        run: python -m registry.validate_registry --root . audit-main --expected-policy-commit "$(git rev-parse HEAD)"
      - name: Verify immutable GitHub Release and Manifest attachment
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYRELEASE'
          import hashlib, json, os, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          tag=os.environ["GITHUB_REF"].removeprefix("refs/tags/")
          release=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases/tags/{tag}"],text=True))
          if release["draft"] or not release.get("immutable"): raise SystemExit("IMMUTABLE_RELEASE_REQUIRED")
          assets={a["name"]:a for a in release["assets"]}
          digest="sha256:"+hashlib.sha256(open("MANIFEST.sha256","rb").read()).hexdigest()
          asset=assets.get(f"{tag}-MANIFEST.sha256")
          if asset is None or asset.get("digest")!=digest: raise SystemExit("RELEASE_MANIFEST_ASSET_MISMATCH")
          print("IMMUTABLE_RELEASE_CHECK",tag,digest)
          PYRELEASE
